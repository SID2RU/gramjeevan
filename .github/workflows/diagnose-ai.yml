name: Diagnose AI

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Test AI endpoints
        run: |
          BODY='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi in 3 words"}]}'
          echo "=== 1. model catalog ==="
          curl -sS -i --max-time 60 https://models.github.ai/catalog/models \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" | head -c 1200 || true
          echo
          echo "=== 2. inference (GitHub docs endpoint) ==="
          curl -sS -i -L --max-time 120 -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
            -d "$BODY" | head -c 1500 || true
          echo
          echo "=== 3. inference (older Azure endpoint) ==="
          curl -sS -i -L --max-time 120 -X POST https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" | head -c 1500 || true
          echo
